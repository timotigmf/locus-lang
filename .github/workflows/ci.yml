name: Verifica
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: macos-15-intel, python: "3.11"}
          - {os: macos-15, python: "3.11"}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - name: Wheel installato fuori dal checkout
        shell: bash
        run: |
          python -m pip uninstall -y italica
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          italica controlla "$GITHUB_WORKSPACE/examples/dichiarazioni.ita"
